# Secret scanning: Gitleaks and Kingfisher over the full git history.
#
# The two catch different things. Gitleaks has broad generic rules; Kingfisher
# covers provider-specific formats. Run both.
#
# This repository is public, so everything a run writes is public. Neither job
# ever prints a matched value:
#   * both tools run with --redact and write only a JSON report in $RUNNER_TEMP;
#   * the job summary is built from rule, file, line and commit fields only;
#   * no report is uploaded as an artifact;
#   * Kingfisher runs with --no-validate, so a run never says whether a found
#     credential is still live.
#
# Gitleaks fails the job on any finding. Kingfisher reports: its findings
# appear as warnings and in the summary, and fail the job only on a tool error.
# A reviewed false positive goes in .gitleaksignore (by fingerprint) or gets a
# `kingfisher:ignore` comment on its line.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        # Downloaded to $RUNNER_TEMP, never into the checkout, so the scan cannot see it.
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          sudo tar xzf "$archive" -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: |
          report="$RUNNER_TEMP/gitleaks-report.json"
          set +e
          gitleaks detect --source . --redact --no-banner --log-level warn \
            --report-format json --report-path "$report"
          rc=$?
          set -e
          {
            echo "## Gitleaks"
            if [ "$rc" -eq 0 ]; then
              echo "No secrets found in the git history."
            elif [ -s "$report" ]; then
              echo "| Rule | File | Line | Commit |"
              echo "|---|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:12]) |"' "$report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::Gitleaks found $(jq length "$report" 2>/dev/null || echo some) potential secret(s); see the job summary"
            exit 1
          fi

  kingfisher:
    name: Kingfisher
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kingfisher
        env:
          KINGFISHER_VERSION: 2.17.0
          KINGFISHER_SHA256: 8798879183d74f9e1379af3071f296853e4027a21bfde5d13d9b064fa1bf1eb3
        run: |
          archive="$RUNNER_TEMP/kingfisher.tgz"
          curl -sSfL -o "$archive" \
            "https://github.com/mongodb/kingfisher/releases/download/v${KINGFISHER_VERSION}/kingfisher-linux-x64.tgz"
          echo "${KINGFISHER_SHA256}  ${archive}" | sha256sum -c -
          sudo tar xzf "$archive" -C /usr/local/bin kingfisher

      - name: Run Kingfisher
        # Exit codes: 0 none, 200 findings, 205 validated findings (not possible
        # with --no-validate), anything else a tool error.
        run: |
          report="$RUNNER_TEMP/kingfisher-report.json"
          set +e
          kingfisher scan . --git-history full --no-validate --redact \
            --format json --output "$report" --no-update-check --quiet
          rc=$?
          set -e
          case "$rc" in 0|200|205) ;; *)
            echo "::error::Kingfisher failed to run (exit $rc)"; exit 1 ;;
          esac
          n="$(jq '.findings | length' "$report")"
          {
            echo "## Kingfisher"
            if [ "$n" -eq 0 ]; then
              echo "No secrets found in the working tree or git history."
            else
              echo "| Rule | File | Line | Commit |"
              echo "|---|---|---|---|"
              jq -r '.findings[] | "| \(.rule.id // "?") | \(.finding.path // "?") | \(.finding.line // "?") | \((.finding.git_metadata.commit.id // "")[0:12]) |"' "$report"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            echo "::warning::Kingfisher found $n potential secret(s); see the job summary"
          fi
